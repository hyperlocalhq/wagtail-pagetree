[tox]
requires =
    tox>=4.22
    tox-uv>=1.11
envlist =
    py{310,311,312,313}-wagtail63-django42
    py{310,311,312,313}-wagtail70-django{42,52}
    py{310,311,312,313,314}-wagtail80-django52
    py{312,313,314}-wagtail80-django{60,61}
    py314-wagtail80-django61-nolocalize

[testenv]
dependency_groups = test
deps =
    wagtail63: wagtail>=6.3,<6.4
    wagtail70: wagtail>=7.0,<7.1
    wagtail80: wagtail>=8.0,<8.1
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    !nolocalize: wagtail-localize
commands =
    pytest {posargs}
