[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-pagetree"
version = "0.1.0"
description = "Lazy-loaded virtualized page tree for the Wagtail admin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Hyperlocal HQ"},
]
keywords = ["wagtail", "django", "admin", "page-tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 6",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
]

dependencies = [
    "Django>=4.2",
    "wagtail>=6.3",
]

[project.optional-dependencies]
localize = ["wagtail-localize>=1.10"]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=5",
]
dev = [
    {include-group = "test"},
    "tox>=4.22",
    "tox-uv>=1.11",
    "wagtail-localize>=1.10",
]

[project.urls]
Repository = "https://github.com/hyperlocalhq/wagtail-pagetree"
"Bug Tracker" = "https://github.com/hyperlocalhq/wagtail-pagetree/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wagtail_pagetree*"]

[tool.setuptools.package-data]
wagtail_pagetree = [
    "templates/wagtail_pagetree/*.html",
    "static/wagtail_pagetree/css/*.css",
    "static/wagtail_pagetree/js/*.js",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not bench'"
markers = [
    "bench: slow benchmark, opt-in via -m bench",
]

[tool.coverage.run]
source = ["wagtail_pagetree"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
